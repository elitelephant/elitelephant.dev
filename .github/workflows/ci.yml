name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned, so the runner's Ubuntu changes only when this line does.
    runs-on: ubuntu-24.04
    # Inside Playwright's image, where the Linux screenshots in tests/e2e were made, so text renders exactly the same.
    # Its browsers come installed; the tag follows @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # In the container the checkout belongs to another user, so git refuses to read it once checkout's own
      # temporary setting is gone; the reference and colour tests list the repo's files with git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The traces and error context of the failed tests, to open with `npx playwright show-trace`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
